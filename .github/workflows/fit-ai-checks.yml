name: FIT AI browser pipeline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-and-mock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/fit-calibration.js
          node --check src/fit-3d-pose.js
          node --check src/fit-garment-motion.js
          node --check src/fit-arm-occlusion.js
          node --check src/fit-3d-renderer.js
      - name: Check model diagnostics syntax
        run: node --check tests/frame-sync.smoke.mjs
      - name: Check project UI contracts
        run: node tests/static-check.mjs
      - name: Simulate synchronized and fast AR camera modes
        run: node tests/frame-sync.smoke.mjs
      - name: Check AutoFit Studio JS module syntax
        run: |
          node --check studio/engine.js
          node --check studio/capture-profiles.js
          node --check studio/capture.js
          node --check studio/app.js
          node --check studio/viewer.js
          node --check studio/asset-pipeline.js
          node --check studio/photo-style.js
          node --check studio/library.js
      - name: Test AutoFit Studio category and asset router
        run: node --test studio/tests/*.test.mjs
      - name: Test body fit calibration and alignment
        run: node --test tests/body-calibration.test.mjs
      - name: Test live 3D pose and real mesh pipeline
        run: node --test tests/fit-3d.test.mjs
      - name: Test garment motion and same-frame arm overlap
        run: node --test tests/garment-motion.test.mjs
      - name: Test rounded garment geometry and interactive sleeve pivots
        run: node --test tests/garment-surface.test.mjs
      - name: Validate actual GLB structure, bones, weights and manifest
        run: node --test tests/reference-glb.test.mjs
      - name: Check GLTFLoader allowlist source syntax
        run: node --check src/fit-glb-assets.js
      - name: Check SDK script syntax
        run: |
          node --check sdk/rawnak-fit.js
          node --check tests/sdk.smoke.mjs
      - name: Simulate merchant embedding
        run: node tests/sdk.smoke.mjs
      - name: Verify real demo photo files and process wiring
        run: |
          node --check demo/catalog.js
          node --check demo/gallery.js
          node --check demo/process.js
          node --test tests/demo-products.test.mjs


