name: Fusion research lab checks
on:
  pull_request:
  push:
    branches: [feature/fusion-v2-lab]
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s fusion -p 'test_*.py'
      - run: python fusion/asset_registry.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check fusion/app.js
      - run: node --check studio/template-intake-ui.mjs
      - run: node --check studio/template-demo.mjs
      - run: node --test studio/tests/template-intake.test.mjs studio/tests/template-parts.test.mjs
